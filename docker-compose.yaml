version: "3.8"

services:
    postgres:
        image: postgres:15
        container_name: postgres-db
        environment:
            POSTGRES_USER: admin
            POSTGRES_PASSWORD: password
            POSTGRES_DB: collabio-db
        ports:
            - "5432:5432"
        networks:
            - my-network
        volumes:
            - pgdata:/var/lib/postgresql/data

networks:
    my-network:
        driver: bridge

volumes:
    pgdata:
        driver: local
